<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark">
        <div class="container">
            <span class="navbar-brand d-flex align-items-center gap-2">
                <i class="bi bi-check2-square fs-4"></i>
                <span>Gerenciador de Tarefas</span>
            </span>
            <span class="navbar-text text-white-50 d-none d-sm-block" id="contador-nav">
                0 tarefas cadastradas
            </span>
        </div>
    </nav>

    <div class="container py-4">

        <!-- Card do Formulario -->
        <div class="card shadow-sm mb-4 card-form">
            <div class="card-header d-flex align-items-center gap-2">
                <i class="bi bi-pencil-square"></i>
                <h5 class="mb-0" id="titulo-form">Nova Tarefa</h5>
            </div>
            <div class="card-body">
                <form id="form-tarefa" novalidate>

                    <!-- Titulo -->
                    <div class="mb-3">
                        <label for="titulo" class="form-label fw-semibold">
                            <i class="bi bi-tag-fill me-1 text-primary"></i>Titulo <span class="text-danger">*</span>
                        </label>
                        <input type="text" id="titulo" class="form-control" placeholder="Digite o titulo da tarefa">
                        <div class="erro-msg" id="erro-titulo"></div>
                    </div>

                    <!-- Descricao -->
                    <div class="mb-3">
                        <label for="descricao" class="form-label fw-semibold">
                            <i class="bi bi-card-text me-1 text-secondary"></i>Descricao
                        </label>
                        <textarea id="descricao" class="form-control" rows="2" placeholder="Descricao opcional..."></textarea>
                    </div>

                    <!-- Linha: Prioridade + Data + Status -->
                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label for="prioridade" class="form-label fw-semibold">
                                <i class="bi bi-flag-fill me-1 text-warning"></i>Prioridade
                            </label>
                            <select id="prioridade" class="form-select">
                                <option value="Baixa">Baixa</option>
                                <option value="Media" selected>Media</option>
                                <option value="Alta">Alta</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="dataLimite" class="form-label fw-semibold">
                                <i class="bi bi-calendar-event me-1 text-info"></i>Data Limite
                            </label>
                            <input type="date" id="dataLimite" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label for="status" class="form-label fw-semibold">
                                <i class="bi bi-circle-half me-1 text-success"></i>Status
                            </label>
                            <select id="status" class="form-select">
                                <option value="Pendente">Pendente</option>
                                <option value="Concluida">Concluida</option>
                            </select>
                        </div>
                    </div>

                    <!-- Container campo observacao (criado via jQuery) -->
                    <div id="campo-observacao-container"></div>

                    <!-- Botoes -->
                    <div class="d-flex gap-2 mt-3">
                        <button type="button" id="btn-observacao" class="btn btn-outline-secondary">
                            <i class="bi bi-chat-left-text me-1"></i>+ Observacao
                        </button>
                        <button type="submit" id="btn-concluir" class="btn btn-success flex-grow-1">
                            <i class="bi bi-check-circle me-1"></i>Concluir
                        </button>
                    </div>

                </form>
            </div>
        </div>

        <!-- Secao da listagem - criada dinamicamente via jQuery -->
        <section id="secao-lista"></section>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Parte A: JavaScript puro - logica e estado -->
    <script src="js/app.js"></script>
    <!-- Parte B: jQuery - interface e DOM -->
    <script src="js/interface.js"></script>

</body>
</html>
