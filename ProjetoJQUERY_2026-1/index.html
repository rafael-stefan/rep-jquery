<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand">Gerenciador de Tarefas</span>
            <span class="navbar-text text-white-50" id="contador-nav">0 tarefas cadastradas</span>
        </div>
    </nav>

    <div class="container py-4">

        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0" id="titulo-form">Nova Tarefa</h5>
            </div>
            <div class="card-body">
                <form id="form-tarefa" novalidate>

                    <div class="mb-3">
                        <label for="titulo" class="form-label">Titulo <span class="text-danger">*</span></label>
                        <input type="text" id="titulo" class="form-control" placeholder="Digite o titulo da tarefa">
                        <div class="erro-msg" id="erro-titulo"></div>
                    </div>

                    <div class="mb-3">
                        <label for="descricao" class="form-label">Descricao</label>
                        <textarea id="descricao" class="form-control" rows="2" placeholder="Descricao opcional..."></textarea>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label for="prioridade" class="form-label">Prioridade</label>
                            <select id="prioridade" class="form-select">
                                <option value="Baixa">Baixa</option>
                                <option value="Media" selected>Media</option>
                                <option value="Alta">Alta</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="dataLimite" class="form-label">Data Limite</label>
                            <input type="date" id="dataLimite" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label for="status" class="form-label">Status</label>
                            <select id="status" class="form-select">
                                <option value="Pendente">Pendente</option>
                                <option value="Concluida">Concluida</option>
                            </select>
                        </div>
                    </div>

                    <div id="campo-observacao-container"></div>

                    <div class="d-flex gap-2 mt-3">
                        <button type="button" id="btn-observacao" class="btn btn-outline-secondary">+ Observacao</button>
                        <button type="submit" id="btn-concluir" class="btn btn-success flex-grow-1">Concluir</button>
                    </div>

                </form>
            </div>
        </div>

        <section id="secao-lista"></section>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/interface.js"></script>

</body>
</html>
